<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Potato AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=Vazirmatn:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161b;
    --panel:#1a1d24;
    --panel-2:#20232b;
    --border:#2a2e38;
    --text:#ecedee;
    --text-dim:#9aa1b0;
    --text-faint:#666e7f;
    --accent:#cf9c42;
    --accent-soft:#3a2f1c;
    --accent-text:#1b1305;
    --bubble-user:#2a2416;
    --bubble-user-border:#4a3c1e;
    --bubble-bot:#1e2128;
    --danger:#c85a5a;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --sidebar-w:280px;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-brand:'Sora',var(--font-ui);
    --font-fa:'Vazirmatn',var(--font-ui);
    --font-mono:'JetBrains Mono',monospace;
  }
  :root[data-theme="light"]{
    --bg:#f7f6f3;
    --panel:#ffffff;
    --panel-2:#f0efeb;
    --border:#e4e2db;
    --text:#20221f;
    --text-dim:#6b6d68;
    --text-faint:#9a9c96;
    --accent:#b17c22;
    --accent-soft:#f3e6c8;
    --accent-text:#231a05;
    --bubble-user:#f3e6c8;
    --bubble-user-border:#e3cd8f;
    --bubble-bot:#f0efeb;
    --danger:#b04848;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--font-ui);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .app{display:flex;height:100dvh;width:100vw;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    transition:margin-left .28s cubic-bezier(.4,0,.2,1);
  }
  .sidebar-head{padding:14px 14px 10px;}
  .brand{
    display:flex;align-items:center;gap:9px;padding:4px 4px 14px;
    font-family:var(--font-brand);font-weight:600;font-size:15.5px;letter-spacing:.2px;
  }
  .brand .mark{
    width:28px;height:28px;border-radius:9px;background:linear-gradient(155deg,var(--accent),#8a6423);
    display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;
  }
  .new-chat-btn{
    width:100%;display:flex;align-items:center;gap:9px;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:var(--radius-md);font-size:13.5px;font-weight:500;
    cursor:pointer;transition:border-color .15s,background .15s;
  }
  .new-chat-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
  .new-chat-btn svg{flex-shrink:0;}

  .search-wrap{padding:10px 14px;}
  .search-box{
    display:flex;align-items:center;gap:7px;background:var(--panel-2);
    border:1px solid transparent;border-radius:var(--radius-sm);padding:7px 10px;
  }
  .search-box:focus-within{border-color:var(--accent);}
  .search-box input{
    background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;
  }
  .search-box input::placeholder{color:var(--text-faint);}
  .search-box svg{color:var(--text-faint);flex-shrink:0;}

  .history{flex:1;overflow-y:auto;padding:4px 10px 10px;}
  .history::-webkit-scrollbar{width:6px;}
  .history::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .group-label{
    font-size:11px;color:var(--text-faint);padding:12px 8px 5px;font-weight:500;
  }
  .chat-item{
    display:flex;align-items:center;gap:8px;padding:9px 9px;border-radius:var(--radius-sm);
    cursor:pointer;color:var(--text-dim);font-size:13.5px;position:relative;
    transition:background .12s;
  }
  .chat-item:hover{background:var(--panel-2);}
  .chat-item.active{background:var(--accent-soft);color:var(--text);}
  .chat-item .title{
    flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chat-item .del{
    opacity:0;flex-shrink:0;background:none;border:none;color:var(--text-faint);
    cursor:pointer;padding:3px;border-radius:6px;display:flex;
  }
  .chat-item:hover .del{opacity:1;}
  .chat-item .del:hover{color:var(--danger);background:rgba(200,90,90,.12);}
  .empty-hist{padding:18px 10px;color:var(--text-faint);font-size:12.5px;line-height:1.5;}

  .sidebar-foot{
    border-top:1px solid var(--border);padding:10px;display:flex;gap:8px;
  }
  .foot-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    background:none;border:1px solid var(--border);color:var(--text-dim);
    padding:8px 6px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;
    transition:border-color .15s,color .15s;
  }
  .foot-btn:hover{border-color:var(--accent);color:var(--text);}

  /* ---------- Backdrop (mobile) ---------- */
  .backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .app.sidebar-open .backdrop{opacity:1;pointer-events:auto;}

  /* ---------- Main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
  .topbar{
    display:flex;align-items:center;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--border);flex-shrink:0;
    background:var(--bg);
  }
  .icon-btn{
    background:none;border:none;color:var(--text-dim);cursor:pointer;
    width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:background .12s,color .12s;
  }
  .icon-btn:hover{background:var(--panel-2);color:var(--text);}
  .topbar-title{
    font-family:var(--font-brand);font-weight:600;font-size:14.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
  }
  .topbar-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}

  .thread{
    flex:1;overflow-y:auto;padding:18px 0 8px;
    display:flex;flex-direction:column;
  }
  .thread::-webkit-scrollbar{width:8px;}
  .thread::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .thread-inner{max-width:720px;margin:0 auto;width:100%;padding:0 18px;}

  .welcome{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;gap:14px;
  }
  .welcome .mark-lg{
    width:56px;height:56px;border-radius:16px;background:linear-gradient(155deg,var(--accent),#8a6423);
    display:flex;align-items:center;justify-content:center;font-size:28px;
  }
  .welcome h1{font-family:var(--font-brand);font-size:20px;margin:0;font-weight:600;}
  .welcome p{color:var(--text-dim);font-size:13.5px;max-width:340px;line-height:1.6;margin:0;}
  .suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:480px;margin-top:6px;}
  .sugg{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
    padding:9px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;
    transition:border-color .15s,color .15s;
  }
  .sugg:hover{border-color:var(--accent);color:var(--text);}

  .msg-row{display:flex;gap:10px;margin-bottom:20px;align-items:flex-start;}
  .msg-row.user{flex-direction:row-reverse;}
  .avatar{
    width:28px;height:28px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px;
  }
  .avatar.bot{background:linear-gradient(155deg,var(--accent),#8a6423);}
  .avatar.user{background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);font-size:11.5px;font-weight:600;}
  .bubble-col{display:flex;flex-direction:column;max-width:78%;}
  .msg-row.user .bubble-col{align-items:flex-end;}
  .bubble{
    padding:10px 14px;border-radius:var(--radius-lg);font-size:14.5px;line-height:1.6;
    white-space:pre-wrap;word-wrap:break-word;
  }
  .msg-row.bot .bubble{background:var(--bubble-bot);border-top-left-radius:5px;}
  .msg-row.user .bubble{
    background:var(--bubble-user);border:1px solid var(--bubble-user-border);
    border-top-right-radius:5px;
  }
  .bubble.farsi{font-family:var(--font-fa);}
  .bubble code{
    font-family:var(--font-mono);background:rgba(0,0,0,.25);padding:1.5px 5px;border-radius:4px;font-size:.9em;
  }
  :root[data-theme="light"] .bubble code{background:rgba(0,0,0,.06);}
  .bubble pre{
    font-family:var(--font-mono);background:#0d0f13;color:#dfe3ea;padding:11px 13px;border-radius:10px;
    overflow-x:auto;font-size:12.5px;margin:8px 0;line-height:1.5;
  }
  :root[data-theme="light"] .bubble pre{background:#22252b;}
  .msg-meta{font-size:10.5px;color:var(--text-faint);margin-top:5px;padding:0 3px;}

  .typing{display:flex;gap:4px;padding:6px 2px;}
  .typing span{
    width:6px;height:6px;border-radius:50%;background:var(--text-faint);
    animation:blink 1.3s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.18s;}
  .typing span:nth-child(3){animation-delay:.36s;}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0);}40%{opacity:1;transform:translateY(-2px);}}

  /* ---------- Composer ---------- */
  .composer-wrap{padding:10px 18px 16px;flex-shrink:0;}
  .tool-row{
    display:flex;gap:6px;max-width:720px;margin:0 auto 8px;overflow-x:auto;
    scrollbar-width:none;
  }
  .tool-row::-webkit-scrollbar{display:none;}
  .tool-chip{
    display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text-dim);padding:6px 11px;border-radius:999px;font-size:12px;cursor:pointer;
    white-space:nowrap;flex-shrink:0;transition:border-color .15s,color .15s;
  }
  .tool-chip:hover{border-color:var(--accent);color:var(--text);}\n  .tool-chip.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--text);}
  .composer{
    max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:8px 8px 8px 15px;transition:border-color .15s;
  }
  .composer:focus-within{border-color:var(--accent);}
  .composer textarea{
    flex:1;background:none;border:none;outline:none;resize:none;color:var(--text);
    font-family:inherit;font-size:14.5px;line-height:1.5;max-height:160px;padding:6px 0;
  }
  .composer textarea::placeholder{color:var(--text-faint);}
  .send-btn{
    width:36px;height:36px;border-radius:11px;border:none;background:var(--accent);color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
    transition:opacity .15s,transform .1s;
  }
  .send-btn:disabled{opacity:.35;cursor:default;}
  .send-btn:not(:disabled):active{transform:scale(.92);}
  .composer-hint{
    text-align:center;font-size:10.5px;color:var(--text-faint);margin-top:8px;max-width:720px;
    margin-left:auto;margin-right:auto;
  }

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:9px 16px;border-radius:999px;font-size:12.5px;z-index:40;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Responsive ---------- */
  @media (max-width:820px){
    .sidebar{
      position:fixed;top:0;bottom:0;left:0;z-index:20;
      margin-left:calc(-1 * var(--sidebar-w));
      box-shadow:0 0 40px rgba(0,0,0,.35);
    }
    .app.sidebar-open .sidebar{margin-left:0;}
    .desktop-only{display:none;}
  }
  @media (min-width:821px){
    .mobile-only{display:none;}
    .backdrop{display:none;}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand"><span class="mark">🥔</span> Potato AI</div>
      <button class="new-chat-btn" id="newChatBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search chats">
      </div>
    </div>
    <div class="history" id="history"></div>
    <div class="sidebar-foot">
      <button class="foot-btn" id="themeBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="themeLabel">Light</span>
      </button>
      <button class="foot-btn" id="clearBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
        Clear all
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open chat list">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div>
        <div class="topbar-title" id="topbarTitle">New chat</div>
        <div class="topbar-sub">🥔 MyBigPotatobot · Groq + Gemini · Live</div>
      </div>
      <button class="icon-btn" id="editTitleBtn" aria-label="Rename chat" title="Rename chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>

    <div class="thread" id="thread">
      <div class="thread-inner" id="threadInner"></div>
    </div>

    <div class="composer-wrap">
      <div class="tool-row" id="toolRow">
        <button class="tool-chip" data-tool="websearch">🔎 Web search</button>
        <button class="tool-chip" data-tool="images">🖼️ Images</button>
        <button class="tool-chip" data-tool="translate">🌐 Translate</button>
        <button class="tool-chip" data-tool="voice">🎙️ Voice reply</button>
        <button class="tool-chip" data-tool="remind">⏰ Reminder</button>
        <button class="tool-chip" data-tool="personality">🎭 Personality</button>
      </div>
      <div class="composer">
        <textarea id="composerInput" rows="1" placeholder="Message Potato AI…"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
        </button>
      </div>
      <div class="composer-hint">Connected to Potato AI · history is stored on this device</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------- Telegram WebApp integration ---------- */
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  var root = document.documentElement;

  function applyTelegramTheme(){
    if(!tg) return;
    var p = tg.themeParams || {};
    if(p.bg_color) root.style.setProperty('--bg', p.bg_color);
    if(p.secondary_bg_color) root.style.setProperty('--panel', p.secondary_bg_color);
    if(p.text_color) root.style.setProperty('--text', p.text_color);
    if(p.hint_color) root.style.setProperty('--text-dim', p.hint_color);
    var scheme = tg.colorScheme === 'light' ? 'light' : 'dark';
    root.setAttribute('data-theme', scheme);
    themeLabel.textContent = scheme === 'light' ? 'Dark' : 'Light';
    try{
      tg.ready();
      tg.expand();
      if(tg.setHeaderColor) tg.setHeaderColor(scheme === 'light' ? '#ffffff' : '#14161b');
    }catch(e){}
  }

  /* ---------- State ---------- */
  var STORE_KEY = 'potato_ai_chats_v1';
  var THEME_KEY = 'potato_ai_theme';
  var state = { chats: [], activeId: null };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) state = JSON.parse(raw);
    }catch(e){}
    if(!state.chats || !state.chats.length){
      var demoId = uid();
      state.chats = [{
        id: demoId,
        title: 'Welcome',
        updatedAt: Date.now(),
        messages: [
          { role:'bot', text:'Hey! I\'m Potato AI 🥔 — ask me anything, or try one of the tools below the message box.', time: Date.now() }
        ]
      }];
      state.activeId = demoId;
    }
    if(!state.activeId) state.activeId = state.chats[0].id;
  }

  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function activeChat(){
    return state.chats.find(function(c){ return c.id === state.activeId; });
  }

  /* ---------- DOM refs ---------- */
  var app = document.getElementById('app');
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('backdrop');
  var historyEl = document.getElementById('history');
  var searchInput = document.getElementById('searchInput');
  var threadInner = document.getElementById('threadInner');
  var threadEl = document.getElementById('thread');
  var topbarTitle = document.getElementById('topbarTitle');
  var composerInput = document.getElementById('composerInput');
  var sendBtn = document.getElementById('sendBtn');
  var newChatBtn = document.getElementById('newChatBtn');
  var menuBtn = document.getElementById('menuBtn');
  var editTitleBtn = document.getElementById('editTitleBtn');
  var themeBtn = document.getElementById('themeBtn');
  var themeLabel = document.getElementById('themeLabel');
  var clearBtn = document.getElementById('clearBtn');
  var toast = document.getElementById('toast');
  var toolRow = document.getElementById('toolRow');

  /* ---------- Helpers ---------- */
  var farsiRe = /[\u0600-\u06FF]/;

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function formatText(raw){
    var text = escapeHtml(raw);
    text = text.replace(/```([\s\S]*?)```/g, function(_, code){
      return '<pre>' + code.trim() + '</pre>';
    });
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return text;
  }

  function timeLabel(ts){
    var d = new Date(ts);
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
  }

  function groupLabel(ts){
    var now = new Date(), d = new Date(ts);
    var sameDay = now.toDateString() === d.toDateString();
    if(sameDay) return 'Today';
    var yest = new Date(now); yest.setDate(now.getDate()-1);
    if(yest.toDateString() === d.toDateString()) return 'Yesterday';
    var diffDays = Math.floor((now - d) / 86400000);
    if(diffDays < 7) return 'Previous 7 days';
    return 'Older';
  }

  /* ---------- Rendering ---------- */
  function renderSidebar(){
    var q = searchInput.value.trim().toLowerCase();
    var sorted = state.chats.slice().sort(function(a,b){ return b.updatedAt - a.updatedAt; });
    if(q){
      sorted = sorted.filter(function(c){
        return c.title.toLowerCase().indexOf(q) !== -1 ||
          c.messages.some(function(m){ return m.text.toLowerCase().indexOf(q) !== -1; });
      });
    }
    historyEl.innerHTML = '';
    if(!sorted.length){
      var empty = document.createElement('div');
      empty.className = 'empty-hist';
      empty.textContent = q ? 'No chats match your search.' : 'No conversations yet — start one below.';
      historyEl.appendChild(empty);
      return;
    }
    var lastGroup = null;
    sorted.forEach(function(c){
      var g = groupLabel(c.updatedAt);
      if(g !== lastGroup){
        var gl = document.createElement('div');
        gl.className = 'group-label';
        gl.textContent = g;
        historyEl.appendChild(gl);
        lastGroup = g;
      }
      var item = document.createElement('div');
      item.className = 'chat-item' + (c.id === state.activeId ? ' active' : '');
      item.innerHTML =
        '<span class="title">' + escapeHtml(c.title || 'New chat') + '</span>' +
        '<button class="del" aria-label="Delete chat" title="Delete">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>' +
        '</button>';
      item.addEventListener('click', function(e){
        if(e.target.closest('.del')){
          e.stopPropagation();
          deleteChat(c.id);
          return;
        }
        state.activeId = c.id;
        save();
        renderAll();
        closeSidebarMobile();
      });
      historyEl.appendChild(item);
    });
  }

  function renderThread(){
    var chat = activeChat();
    threadInner.innerHTML = '';
    topbarTitle.textContent = chat.title || 'New chat';

    if(!chat.messages.length){
      var w = document.createElement('div');
      w.className = 'welcome';
      w.innerHTML =
        '<div class="mark-lg">🥔</div>' +
        '<h1>What are we digging into?</h1>' +
        '<p>Chat with the real Potato AI bot. Your chat list is stored on this device.</p>' +
        '<div class="suggestions">' +
          '<button class="sugg" data-fill="Summarize this article for me">Summarize an article</button>' +
          '<button class="sugg" data-fill="Set a reminder for tomorrow at 9am">Set a reminder</button>' +
          '<button class="sugg" data-fill="سلام! امروز چه کاری می‌تونی برام انجام بدی؟">سلام بگو 🇮🇷</button>' +
        '</div>';
      threadInner.appendChild(w);
      w.querySelectorAll('.sugg').forEach(function(btn){
        btn.addEventListener('click', function(){
          composerInput.value = btn.getAttribute('data-fill');
          autosize();
          composerInput.focus();
        });
      });
      return;
    }

    chat.messages.forEach(function(m){
      threadInner.appendChild(renderMessage(m));
    });
  }

  function renderMessage(m){
    var row = document.createElement('div');
    row.className = 'msg-row ' + (m.role === 'user' ? 'user' : 'bot');

    var avatar = document.createElement('div');
    avatar.className = 'avatar ' + (m.role === 'user' ? 'user' : 'bot');
    avatar.textContent = m.role === 'user' ? 'You' : '🥔';

    var col = document.createElement('div');
    col.className = 'bubble-col';

    var bubble = document.createElement('div');
    bubble.className = 'bubble' + (farsiRe.test(m.text) ? ' farsi' : '');
    if(farsiRe.test(m.text)) bubble.dir = 'rtl';
    bubble.innerHTML = formatText(m.text);

    var meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = timeLabel(m.time);

    col.appendChild(bubble);
    col.appendChild(meta);
    row.appendChild(avatar);
    row.appendChild(col);
    return row;
  }

  function scrollToBottom(){
    threadEl.scrollTop = threadEl.scrollHeight;
  }

  function renderAll(){
    renderSidebar();
    renderThread();
    scrollToBottom();
  }

  /* ---------- Actions ---------- */
  function newChat(){
    var id = uid();
    state.chats.unshift({ id:id, title:'New chat', updatedAt:Date.now(), messages:[] });
    state.activeId = id;
    save();
    renderAll();
    closeSidebarMobile();
    composerInput.focus();
  }

  function deleteChat(id){
    var idx = state.chats.findIndex(function(c){ return c.id === id; });
    if(idx === -1) return;
    state.chats.splice(idx, 1);
    if(state.activeId === id){
      state.activeId = state.chats.length ? state.chats[0].id : null;
      if(!state.activeId){
        var nid = uid();
        state.chats = [{ id:nid, title:'New chat', updatedAt:Date.now(), messages:[] }];
        state.activeId = nid;
      }
    }
    save();
    renderAll();
  }

  function renameActiveChat(){
    var chat = activeChat();
    var next = prompt('Rename this chat', chat.title || '');
    if(next === null) return;
    next = next.trim();
    if(next){
      chat.title = next;
      save();
      renderAll();
    }
  }

  /* ---------- Live bot connection ---------- */
  var selectedProvider = 'groq';
  var PROVIDER_LABELS = {
    groq: 'Groq',
    gemini: 'Gemini',
    groq_search: 'Web search',
    groq_images: 'Images'
  };

  async function sendMessage(){
    var text = composerInput.value.trim();
    if(!text) return;
    var chat = activeChat();
    chat.messages.push({ role:'user', text:text, time:Date.now() });
    if(chat.title === 'New chat' || !chat.title){
      chat.title = text.length > 42 ? text.slice(0,42) + '…' : text;
    }
    chat.updatedAt = Date.now();
    composerInput.value = '';
    autosize();
    save();
    renderAll();

    var typingRow = document.createElement('div');
    typingRow.className = 'msg-row bot';
    typingRow.innerHTML =
      '<div class="avatar bot">🥔</div>' +
      '<div class="bubble-col"><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>';
    threadInner.appendChild(typingRow);
    scrollToBottom();

    sendBtn.disabled = true;
    try{
      if(!tg || !tg.initData){
        throw new Error('Open this app from Telegram so the bot can identify you.');
      }

      var res = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          initData: tg.initData,
          message: text,
          provider: selectedProvider
        })
      });
      var data = await res.json();
      if(!res.ok || !data.ok) throw new Error(data.error || 'The AI request failed.');

      typingRow.remove();
      chat.messages.push({ role:'bot', text:data.reply || 'I got an empty response.', time:Date.now() });
      chat.updatedAt = Date.now();
      save();
      renderAll();
    }catch(err){
      typingRow.remove();
      chat.messages.push({
        role:'bot',
        text:'⚠️ ' + (err.message || 'Something went wrong. Please try again.'),
        time:Date.now()
      });
      chat.updatedAt = Date.now();
      save();
      renderAll();
    }finally{
      sendBtn.disabled = false;
      composerInput.focus();
    }
  }

  function autosize(){
    composerInput.style.height = 'auto';
    composerInput.style.height = Math.min(composerInput.scrollHeight, 160) + 'px';
  }

  function openSidebarMobile(){ app.classList.add('sidebar-open'); }
  function closeSidebarMobile(){ app.classList.remove('sidebar-open'); }

  function toggleTheme(){
    var cur = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    var next = cur === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    themeLabel.textContent = next === 'light' ? 'Dark' : 'Light';
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  }

  /* ---------- Wire up ---------- */
  newChatBtn.addEventListener('click', newChat);
  menuBtn.addEventListener('click', openSidebarMobile);
  backdrop.addEventListener('click', closeSidebarMobile);
  editTitleBtn.addEventListener('click', renameActiveChat);
  themeBtn.addEventListener('click', toggleTheme);
  searchInput.addEventListener('input', renderSidebar);
  sendBtn.addEventListener('click', sendMessage);
  composerInput.addEventListener('input', autosize);
  composerInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  clearBtn.addEventListener('click', function(){
    if(!confirm('Delete all chats on this device?')) return;
    var nid = uid();
    state.chats = [{ id:nid, title:'New chat', updatedAt:Date.now(), messages:[] }];
    state.activeId = nid;
    save();
    renderAll();
  });
  toolRow.addEventListener('click', function(e){
    var chip = e.target.closest('.tool-chip');
    if(!chip) return;
    var tool = chip.getAttribute('data-tool');

    if(tool === 'websearch'){
      selectedProvider = 'groq_search';
      showToast('🔎 Web search mode selected');
    }else if(tool === 'images'){
      selectedProvider = 'groq_images';
      showToast('🖼️ Image search mode selected');
    }else if(tool === 'voice'){
      showToast('🎙️ Voice replies are still handled by the Telegram bot');
      return;
    }else if(tool === 'translate'){
      showToast('🌐 Ask me to translate something, and I will translate it');
      selectedProvider = 'groq';
    }else if(tool === 'remind'){
      showToast('⏰ Tell me what to remind you about and when');
      selectedProvider = 'groq';
    }else if(tool === 'personality'){
      showToast('🎭 Personality settings are available through the bot menu');
      selectedProvider = 'groq';
    }

    document.querySelectorAll('.tool-chip').forEach(function(x){
      x.classList.toggle('selected', x === chip);
    });
  });

  /* ---------- Init ---------- */
  load();
  try{
    var savedTheme = localStorage.getItem(THEME_KEY);
    if(savedTheme) root.setAttribute('data-theme', savedTheme);
  }catch(e){}
  applyTelegramTheme();
  if(tg && tg.onEvent){
    tg.onEvent('themeChanged', applyTelegramTheme);
  }
  renderAll();
  autosize();
})();
</script>
</body>
</html>
